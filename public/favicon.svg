<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Soft Ambient Luminous Halo -->
    <radialGradient id="favAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#022c16" stop-opacity="0" />
    </radialGradient>

    <!-- Primary Leaf Luminous Gradient -->
    <linearGradient id="favLeafGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="40%" stop-color="#34D399" />
      <stop offset="85%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Tender Sprout Gradient -->
    <linearGradient id="favSproutGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>

    <!-- Dewdrop Gradient -->
    <linearGradient id="favGoldDew" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#10B981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Circular Translucent Container -->
  <circle cx="50" cy="50" r="46" fill="#07170E" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.35" />
  <circle cx="50" cy="50" r="46" fill="url(#favAura)" />

  <!-- Floating Loose Leaf Pair -->
  <g filter="url(#favGlow)">
    <!-- Small Leaf Sprout -->
    <path
      d="M 46 68 C 30 68, 22 56, 26 44 C 30 32, 42 36, 47 48 C 49 53, 49 61, 46 68 Z"
      fill="url(#favSproutGrad)"
      opacity="0.9"
    />
    <path
      d="M 28 42 C 34 50, 42 58, 46 67"
      stroke="#064E3B"
      stroke-width="1.4"
      stroke-linecap="round"
      fill="none"
      opacity="0.85"
    />

    <!-- Primary Loose Leaf -->
    <path
      d="M 38 78 C 36 62, 40 44, 52 30 C 62 18, 76 14, 80 18 C 84 22, 80 38, 70 52 C 58 68, 46 76, 38 78 Z"
      fill="url(#favLeafGrad)"
      stroke="#A7F3D0"
      stroke-width="1.0"
      stroke-opacity="0.65"
    />
    <path
      d="M 40 76 C 47 62, 58 46, 78 20"
      stroke="#E6FFFA"
      stroke-width="1.8"
      stroke-linecap="round"
      fill="none"
      opacity="0.95"
    />
    <path d="M 48 64 Q 57 63, 62 60" stroke="#E6FFFA" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M 54 53 Q 63 50, 68 46" stroke="#E6FFFA" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M 61 41 Q 69 37, 73 32" stroke="#E6FFFA" stroke-width="1.0" stroke-linecap="round" fill="none" opacity="0.7" />

    <!-- Dewdrop -->
    <circle cx="67" cy="38" r="2.5" fill="url(#favGoldDew)" opacity="0.95" />
    <circle cx="66.3" cy="37.3" r="0.8" fill="#FFFFFF" />
  </g>
</svg>
